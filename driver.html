<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lynx Day Runner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%23e2b458'>✦</text></svg>">
<style>
  :root {
    --bg: #060810; --surface: #0d1020; --surface-2: #141a2e; --line: #1e2540;
    --text: #f2f4fa; --muted: #97a0b8; --accent: #e2b458; --green: #7ec97e; --red: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding-bottom: 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }
  header { padding: 18px 0 12px; text-align: center; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  header b { letter-spacing: 0.2em; font-size: 1.05rem; }
  header span { display: block; font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
  h2 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; }

  .trip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .trip.done { opacity: 0.45; }
  .trip.done .t-name { text-decoration: line-through; }
  .t-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .t-time { color: var(--accent); font-weight: 700; font-size: 1.15rem; white-space: nowrap; }
  .t-name { font-weight: 700; font-size: 1.02rem; flex: 1; }
  .t-stops { margin: 10px 0 12px; }
  .t-stop { display: flex; gap: 9px; padding: 3px 0; color: var(--muted); font-size: 0.92rem; align-items: baseline; }
  .t-stop i { color: var(--accent); font-style: normal; font-size: 0.75rem; min-width: 14px; }
  .t-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .t-actions a, .t-actions button {
    flex: 1; min-width: 90px; text-align: center; text-decoration: none; cursor: pointer;
    padding: 12px 8px; border-radius: 100px; font-weight: 700; font-size: 0.9rem; font-family: inherit;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  }
  .t-actions a.nav { background: var(--accent); border-color: var(--accent); color: #14100a; flex: 2; }
  .t-actions button.done-btn { color: var(--green); }
  .t-actions button.del { color: var(--red); flex: 0; min-width: 52px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 0.95rem; }

  form {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    display: grid; gap: 10px;
  }
  label { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
  input, textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); padding: 12px; font-size: 16px; font-family: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 84px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
  button.add {
    background: var(--accent); color: #14100a; border: none; border-radius: 100px;
    padding: 14px; font-weight: 700; font-size: 1rem; font-family: inherit; cursor: pointer;
  }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .foot button { background: none; border: none; color: var(--muted); font-size: 0.8rem; cursor: pointer; font-family: inherit; text-decoration: underline; }
  .hint { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <b>LYNX</b><span>Day Runner · driver only</span>
</header>

<div class="wrap">
  <h2>Today's Trips</h2>
  <div id="trips"></div>

  <h2>Add a Trip</h2>
  <form id="add-form">
    <div class="row2">
      <div><label for="f-time">Time</label><input type="time" id="f-time" required></div>
      <div><label for="f-name">Who / what</label><input type="text" id="f-name" placeholder="Marcus · Night Out" required></div>
    </div>
    <div>
      <label for="f-phone">Phone (optional)</label>
      <input type="tel" id="f-phone" placeholder="For one-tap call/text">
    </div>
    <div>
      <label for="f-stops">Stops — one per line, in order</label>
      <textarea id="f-stops" placeholder="1234 Oak St (pickup)&#10;Starbucks, 500 Congress Ave&#10;Domain shopping center&#10;1234 Oak St (home)" required></textarea>
      <p class="hint">First line = pickup. Navigation starts from wherever you are.</p>
    </div>
    <button class="add" type="submit">Add to Today</button>
  </form>

  <div class="foot">
    <span class="hint">Saved on this phone only — nothing leaves your browser.</span>
    <button id="clear-day">Clear day</button>
  </div>
</div>

<script>
  var KEY = 'lynx-day-runner';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(t) { localStorage.setItem(KEY, JSON.stringify(t)); }

  // One tap → Google Maps with the whole route loaded, starting from current location
  function mapsLink(stops) {
    var dest = stops[stops.length - 1];
    var way = stops.slice(0, -1);
    var url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
    if (way.length) url += '&waypoints=' + way.map(encodeURIComponent).join('%7C');
    return url;
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render() {
    var trips = load().sort(function (a, b) { return a.time < b.time ? -1 : 1; });
    var box = document.getElementById('trips');
    if (!trips.length) {
      box.innerHTML = '<div class="empty">No trips yet. Add the day\'s bookings below — each one becomes a one-tap route.</div>';
      return;
    }
    box.innerHTML = trips.map(function (t, i) {
      var stops = t.stops.map(function (s, j) {
        return '<div class="t-stop"><i>' + (j === 0 ? '◉' : j === t.stops.length - 1 ? '★' : (j + 1)) + '</i>' + esc(s) + '</div>';
      }).join('');
      var phone = t.phone ? '<a href="tel:' + esc(t.phone) + '">Call</a><a href="sms:' + esc(t.phone) + '">Text</a>' : '';
      return '<div class="trip' + (t.done ? ' done' : '') + '">' +
        '<div class="t-head"><span class="t-time">' + esc(t.time) + '</span><span class="t-name">' + esc(t.name) + '</span></div>' +
        '<div class="t-stops">' + stops + '</div>' +
        '<div class="t-actions">' +
          '<a class="nav" target="_blank" rel="noopener" href="' + mapsLink(t.stops) + '">▶ Navigate</a>' + phone +
          '<button class="done-btn" data-i="' + i + '" data-act="done">' + (t.done ? 'Undo' : '✓ Done') + '</button>' +
          '<button class="del" data-i="' + i + '" data-act="del">✕</button>' +
        '</div></div>';
    }).join('');
  }

  document.getElementById('trips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var trips = load().sort(function (a, c) { return a.time < c.time ? -1 : 1; });
    var i = +b.dataset.i;
    if (b.dataset.act === 'del') { if (!confirm('Remove this trip?')) return; trips.splice(i, 1); }
    else trips[i].done = !trips[i].done;
    save(trips); render();
  });

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var stops = document.getElementById('f-stops').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!stops.length) return;
    var trips = load();
    trips.push({
      time: document.getElementById('f-time').value,
      name: document.getElementById('f-name').value,
      phone: document.getElementById('f-phone').value.trim(),
      stops: stops, done: false
    });
    save(trips); e.target.reset(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('clear-day').addEventListener('click', function () {
    if (confirm('Clear all of today\'s trips?')) { save([]); render(); }
  });

  render();
</script>

</body>
</html>
